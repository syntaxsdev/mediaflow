profiles:
  avatar:
    # Upload configuration
    kind: "image"
    allowed_mimes: ["image/jpeg", "image/png", "image/webp"]
    size_max_bytes: 5242880  # 5MB
    multipart_threshold_mb: 15
    part_size_mb: 8
    token_ttl_seconds: 900  # 15 minutes
    storage_path: "originals/avatars/{shard?}/{key_base}"
    enable_sharding: true
    
    # Processing configuration
    thumb_folder: "thumbnails/avatars"
    sizes: ["128", "256"]
    default_size: "256"
    quality: 90
    convert_to: "webp"
  
  photo:
    # Upload configuration
    kind: "image"
    allowed_mimes: ["image/jpeg", "image/png", "image/webp"]
    size_max_bytes: 20971520  # 20MB
    multipart_threshold_mb: 15
    part_size_mb: 8
    token_ttl_seconds: 900
    storage_path: "originals/photos/{shard?}/{key_base}"
    enable_sharding: true
    
    # Processing configuration
    thumb_folder: "thumbnails/photos"
    sizes: ["256", "512", "1024"]
    default_size: "256"
    quality: 90
    convert_to: "webp"
  
  banner:
    # Upload configuration
    kind: "image"
    allowed_mimes: ["image/jpeg", "image/png", "image/webp"]
    size_max_bytes: 10485760  # 10MB
    multipart_threshold_mb: 15
    part_size_mb: 8
    token_ttl_seconds: 900
    storage_path: "originals/banners/{shard?}/{key_base}"
    enable_sharding: true
    
    # Processing configuration
    thumb_folder: "thumbnails/banners"
    sizes: ["512", "1024", "2048"]
    default_size: "512"
    quality: 95
    convert_to: "webp"
  
  video:
    # Upload configuration
    kind: "video"
    allowed_mimes: ["video/mp4", "video/quicktime", "video/webm"]
    size_max_bytes: 104857600  # 100MB
    multipart_threshold_mb: 15
    part_size_mb: 8
    token_ttl_seconds: 1800  # 30 minutes
    storage_path: "originals/videos/{shard?}/{key_base}"
    enable_sharding: true

    # Processing configuration (future implementation)
    proxy_folder: "proxies/videos"
    formats: ["mp4", "webm"]
    quality: 80

  trailer:
    kind: "video"
    delivery: "stream"  # bytes go to Cloudflare Stream, not R2
    allowed_mimes: ["video/mp4", "video/quicktime"]
    size_max_bytes: 78643200  # 75MB; Stream caps plain POST at 200MB and TUS at 30GB
    token_ttl_seconds: 1800
    max_duration_seconds: 45  # also passed to Stream as upload-time cap
    min_width: 1280
    min_height: 720

  download:
    # Private digital deliverables. Served only via /v1/downloads/presign
    # (auth-gated) — never through the public image routes.
    #
    # If your default bucket is exposed by a public CDN domain, store these in a
    # separate private bucket (no public domain): set `bucket: deliverables`
    # below and `S3_BUCKET_DELIVERABLES=<bucket>` in the environment. Unset, it
    # uses the default S3_BUCKET.
    # bucket: "deliverables"
    kind: "file"
    allowed_mimes: [
      "application/pdf", "application/zip", "application/epub+zip",
      "application/octet-stream", "image/png", "image/jpeg", "image/svg+xml",
      "audio/mpeg", "audio/wav", "video/mp4", "application/postscript",
    ]
    size_max_bytes: 524288000  # 500MB
    multipart_threshold_mb: 50
    part_size_mb: 16
    token_ttl_seconds: 900  # 15 minutes
    storage_path: "private/downloads/{key_base}"
    enable_sharding: false

  default:
    # Upload configuration
    kind: "image"
    allowed_mimes: ["image/jpeg", "image/png"]
    size_max_bytes: 10485760  # 10MB
    multipart_threshold_mb: 15
    part_size_mb: 8
    token_ttl_seconds: 900
    storage_path: "originals/{shard?}/{key_base}"
    enable_sharding: true
    
    # Processing configuration
    thumb_folder: "thumbnails"
    sizes: ["256", "512"]
    default_size: "256"
    quality: 90
    convert_to: "webp"

